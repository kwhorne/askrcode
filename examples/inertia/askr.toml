name = "inertiademo"
main = "inertiademo.lpr"
frontend = "frontend"
port = 8080
backend_port = 8081

# Only this directory has app code; the framework is at the askr path below.
units = "."
# The framework's sources are watched too, so a change there triggers a rebuild.
watch = ".,/Users/kh/code/askrcode/src"

askr = "/Users/kh/code/askrcode"

# -O1 in dev. -O2 costs more than it gives when the loop is measured in milliseconds.
flags = "-Sh -O1 -vw -WM11.0"
