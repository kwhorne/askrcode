name = "inertiademo"
main = "inertiademo.lpr"
frontend = "frontend"
port = 8080
backend_port = 8081

# Bare denne mappa har appkode; rammeverket ligger i askr-stien under.
units = "."
# Rammeverkets kilder følges også, så en endring der utløser rebuild.
watch = ".,/Users/kh/code/askrcode/src"

askr = "/Users/kh/code/askrcode"

# -O1 i dev. -O2 koster mer enn det gir når løkka måles i millisekunder.
flags = "-Sh -O1 -vw -WM11.0"
